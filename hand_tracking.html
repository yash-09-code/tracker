<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hand tracking</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100dvh; margin: 0; overflow: hidden; background: #101216; }
    video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { width: 100%; height: 100%; display: block; }
    #capture, #settings, #switch-camera { position: fixed; width: 46px; height: 46px; border: 0;
      border-radius: 50%; background: #ffffff; color: #111; font-size: 24px; cursor: pointer; }
    #capture { left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); }
    #settings { left: max(20px, env(safe-area-inset-left)); top: max(20px, env(safe-area-inset-top)); background: #252a31; color: #fff; }
    #switch-camera { right: max(20px, env(safe-area-inset-right)); top: max(20px, env(safe-area-inset-top)); background: #252a31; color: #fff; }
    #panel { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(88px, calc(env(safe-area-inset-top) + 68px)); width: min(300px, calc(100% - 40px));
      padding: 16px; border-radius: 16px; background: #1b1f25; color: #fff; font: 16px system-ui, sans-serif;
      box-shadow: 0 8px 28px #0008; display: none; }
    #panel.open { display: block; }
    #panel h2 { margin: 0 0 5px; font-size: 20px; }
    #panel p { margin: 0 0 15px; color: #b8c0ca; font-size: 14px; }
    .trackers { display: flex; gap: 8px; flex-wrap: wrap; }
    .tracker { border: 1px solid #58616e; border-radius: 20px; padding: 8px 12px; color: #fff; cursor: pointer; }
    .tracker input { position: absolute; opacity: 0; }
    .tracker:has(input:checked) { background: #72f1b8; color: #101216; border-color: #72f1b8; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      color: #fff; font: 16px system-ui, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="landmarks"></canvas>
  <button id="settings" title="Tracking settings" aria-label="Tracking settings">☰</button>
  <button id="switch-camera" title="Switch camera" aria-label="Switch camera">&#8635;</button>
  <button id="capture" title="Save picture" aria-label="Save picture"></button>
  <section id="panel" aria-label="Tracking settings">
    <h2>Tracking settings</h2>
    <p>Select one or more trackers.</p>
    <div class="trackers">
      <label class="tracker"><input type="checkbox" checked data-tracker="hand"> Hand</label>
      <label class="tracker"><input type="checkbox" checked data-tracker="face"> Face</label>
      <label class="tracker"><input type="checkbox" data-tracker="body"> Body</label>
    </div>
  </section>
  <div id="status">Starting camera…</div>
  <script type="module">
    const status = document.querySelector('#status');
    const video = document.querySelector('#camera');
    const canvas = document.querySelector('#landmarks');
    const ctx = canvas.getContext('2d');
    const capture = document.querySelector('#capture');
    const settings = document.querySelector('#settings');
    const switchCamera = document.querySelector('#switch-camera');
    const panel = document.querySelector('#panel');
    const visionVersion = '0.10.22-rc.20250304';
    const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]];
    let detector;
    let faceDetector;
    let bodyDetector;
    let vision;
    let files;
    let lastInferenceTime = 0;
    let pixelRatio = 1;
    let cameraStream;
    let facingMode = 'environment';
    const trackerInputs = Object.fromEntries(
      [...document.querySelectorAll('[data-tracker]')].map(input => [input.dataset.tracker, input]));
    const bodyConnections = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],
      [25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32]];

    function resize() {
      // Higher device pixel ratios make every model result much more expensive to draw.
      pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(canvas.clientWidth * pixelRatio);
      canvas.height = Math.round(canvas.clientHeight * pixelRatio);
    }
    window.addEventListener('resize', resize);
    new ResizeObserver(resize).observe(document.body);
    resize();

    capture.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `hand-landmarks-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    settings.addEventListener('click', () => panel.classList.toggle('open'));
    switchCamera.addEventListener('click', async () => {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      try {
        await startCamera();
      } catch (error) {
        status.textContent = `Could not switch camera: ${error.message || error}`;
        document.body.append(status);
      }
    });
    for (const input of Object.values(trackerInputs)) {
      input.addEventListener('change', async () => {
        if (!input.checked) return;
        try {
          await ensureTracker(input.dataset.tracker);
        } catch (error) {
          input.checked = false;
          status.textContent = `Could not start ${input.dataset.tracker} tracking: ${error.message || error}`;
          document.body.append(status);
        }
      });
    }

        throw new Error('Camera access requires HTTPS or localhost in a supported browser.');
      }

    async function startCamera() {
      cameraStream?.getTracks().forEach(track => track.stop());
      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 640, max: 960 },
          height: { ideal: 480, max: 720 },
          frameRate: { ideal: 24, max: 30 }
        }
      });
      video.srcObject = cameraStream;
      await video.play();
    }

    async function ensureTracker(tracker) {
      const taskFiles = files;
      if (!taskFiles) throw new Error('MediaPipe is still loading.');
      if (tracker === 'hand' && !detector) {
        detector = await vision.HandLandmarker.createFromOptions(taskFiles, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
          runningMode: 'VIDEO', numHands: 2
        });
      }
      if (tracker === 'face' && !faceDetector) {
        faceDetector = await vision.FaceLandmarker.createFromOptions(taskFiles, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' },
          runningMode: 'VIDEO', numFaces: 1
        });
      }
      if (tracker === 'body' && !bodyDetector) {
        bodyDetector = await vision.PoseLandmarker.createFromOptions(taskFiles, {
          baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task' },
          runningMode: 'VIDEO', numPoses: 1
        });
      }
    }

    function draw() {
      if (!detector || video.readyState < 2) { requestAnimationFrame(draw); return; }
      const timestamp = performance.now();
      const enabledCount = Object.values(trackerInputs).filter(input => input.checked).length;
      // Face and body models are much heavier than hand tracking. Adapt the
      // inference rate so enabling all three does not freeze the page.
      const inferenceInterval = 1000 / (enabledCount >= 3 ? 12 : enabledCount === 2 ? 18 : 24);
      if (timestamp - lastInferenceTime < inferenceInterval) {
        requestAnimationFrame(draw);
        return;
      }
      lastInferenceTime = timestamp;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const hands = trackerInputs.hand.checked
        ? detector.detectForVideo(video, timestamp).landmarks || [] : [];
      for (const hand of hands) {
        ctx.strokeStyle = '#72f1b8';
        ctx.lineWidth = 2.5 * pixelRatio;
        for (const [a, b] of connections) {
          const start = project(hand[a]);
          const end = project(hand[b]);
          ctx.beginPath();
          ctx.moveTo(start.x, start.y);
          ctx.lineTo(end.x, end.y);
          ctx.stroke();
        }
        ctx.fillStyle = '#ffca62';
        for (const point of hand) {
          ctx.beginPath();
          const position = project(point);
          ctx.arc(position.x, position.y,
              4 * pixelRatio, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (trackerInputs.face.checked && faceDetector) {
        const faces = faceDetector.detectForVideo(video, timestamp).faceLandmarks || [];
        for (const face of faces) drawPoints(face, '#bc8cff', 1.8 * pixelRatio);
      }
      if (trackerInputs.body.checked && bodyDetector) {
        const bodies = bodyDetector.detectForVideo(video, timestamp).landmarks || [];
        for (const body of bodies) {
          ctx.strokeStyle = '#62b7ff';
          ctx.lineWidth = 2.5 * pixelRatio;
          for (const [a, b] of bodyConnections) {
            const start = project(body[a]);
            const end = project(body[b]);
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
          }
          // MediaPipe Pose indices 0–10 belong to the face. The Body mode
          // deliberately starts at the shoulders (index 11).
          drawPoints(body.slice(11), '#62b7ff', 4 * pixelRatio);
        }
      }
      requestAnimationFrame(draw);
    }

    function drawPoints(points, color, radius) {
      ctx.fillStyle = color;
      for (const point of points) {
        const position = project(point);
        ctx.beginPath();
        ctx.arc(position.x, position.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function project(point) {
      const sourceWidth = video.videoWidth || 640;
      const sourceHeight = video.videoHeight || 480;
      const scale = Math.min(canvas.width / sourceWidth, canvas.height / sourceHeight);
      const width = sourceWidth * scale;
      const height = sourceHeight * scale;
      return {
        x: (canvas.width - width) / 2 +
            (facingMode === 'user' ? 1 - point.x : point.x) * width,
        y: (canvas.height - height) / 2 + point.y * height,
      };
    }
  </script>
</body>
</html>
